plugins {
    id 'com.android.library'
}

version          = version_number
group            = group_info

android {
    namespace = 'org.whispersystems.libsignal'
    compileSdk = 34

    defaultConfig {
        minSdkVersion = 21
        targetSdkVersion = 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

dependencies {
    api(project(':java'))
    // The vendored protocol tests in :tests are pure JVM and run in :java:test, which has the
    // libsignal-client and curve25519 runtime deps they need; do not duplicate them here.
    androidTestImplementation 'junit:junit:4.13.2'
}
