plugins {
    id 'java-library'
}

evaluationDependsOn(':tests')

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

version          = version_number
group            = group_info

dependencies {
    // The vendored ecc.Curve now delegates to the maintained Rust core. It is compiled against the
    // maintained API here (compileOnly, so the maintained classes are NOT bundled/duplicated by this
    // module); at runtime they are provided by the app's libsignal-android (and, for this module's own
    // JVM tests, by the testImplementation libsignal-client below).
    compileOnly 'org.signal:libsignal-client:0.72.1'
    api 'com.google.protobuf:protobuf-java:4.36.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation(project(path: ':tests', configuration: 'testArtifacts'))

    // Cross-validation tests: the maintained libsignal-client (Rust core + host-native JNI),
    // pinned to 0.72.1 — the last release whose Java API can both CREATE and RECEIVE a classic
    // X3DH (session v3) PreKeyBundle. 0.73.0 removed the no-Kyber PreKeyBundle ctor; 0.75.0
    // removed the Rust X3DH protocol entirely (everything after forces PQXDH/v4).
    // The JVM artifact bundles desktop .so (incl. Windows x86_64) so the cross-validation tests
    // run on the dev host without an Android device. Different namespace
    // (org.signal.libsignal.protocol.*) so it coexists with the vendored
    // org.whispersystems.libsignal classes on the test classpath.
    testImplementation 'org.signal:libsignal-client:0.72.1'

    // The archived curve25519-java is retained on the TEST classpath only, to cross-verify that the
    // maintained Rust engine's X25519 agreement and XEd25519 signatures interoperate with the old
    // implementation (i.e. peers on the previous build). It is no longer a main/runtime dependency.
    testImplementation "org.whispersystems:curve25519-java:${curve25519_version}"
}


test {
    testLogging {
        events 'passed'
        showStandardStreams = true
    }

    include 'org/whispersystems/**'

    dependsOn project(':tests').tasks.named('testClasses')
    testClassesDirs = files(testClassesDirs, project(':tests').sourceSets.test.output.classesDirs)
    classpath += project(':tests').sourceSets.test.runtimeClasspath
}

