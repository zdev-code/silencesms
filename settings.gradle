pluginManagement {
	repositories {
		google()
		mavenCentral()
		gradlePluginPortal()
	}
}

include ':org.whispersystems.jobmanager'
project(':org.whispersystems.jobmanager').projectDir = new File(rootDir, 'libs/org.whispersystems.jobmanager')

include ':java', ':tests'
project(':tests').projectDir = new File(rootDir, 'libs/org.whispersystems.libsignal/tests')
project(':java').projectDir = new File(rootDir, 'libs/org.whispersystems.libsignal/java')
include ':org.whispersystems.libsignal'
project(':org.whispersystems.libsignal').projectDir = new File(rootDir, 'libs/org.whispersystems.libsignal/android')

