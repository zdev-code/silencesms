org.gradle.jvmargs=-Xms512m -Xmx2048m -Dfile.encoding=UTF-8
whisperSonatypeUsername=
whisperSonatypePassword=
sonatypeRepo=/dev/null

android.nonTransitiveRClass=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.useAndroidX=true
# All dependencies are AndroidX-native or vendored/excluded off the legacy support libraries, so
# Jetifier is no longer required (verify with ./gradlew checkJetifier).
android.enableJetifier=false

VERSION_NAME=
VERSION_CODE=
GROUP=
POM_DESCRIPTION=
POM_URL=
POM_SCM_URL=
POM_SCM_CONNECTION=
POM_SCM_DEV_CONNECTION=
POM_LICENCE_NAME=
POM_LICENCE_URL=
POM_LICENCE_DIST=
POM_DEVELOPER_ID=
POM_DEVELOPER_NAME=
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
